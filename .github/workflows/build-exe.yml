name: Build portable exe

# Builds on every pull request, on main and on v* tags (a push to a feature branch with an open PR
# would otherwise build twice).
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build IVAO_VMR_Generator.exe
        run: pyinstaller build_exe.spec

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\IVAO_VMR_Generator.exe -ArgumentList "--no-browser","--port","8765" -PassThru -NoNewWindow
          Start-Sleep -Seconds 8
          try {
            $state = Invoke-RestMethod http://127.0.0.1:8765/api/state
            if ($state.presets.Count -lt 1) { throw "no presets bundled" }
            $html = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
            if ($html.StatusCode -ne 200) { throw "GUI page not served" }
            Write-Host "OK: $($state.presets.Count) presets, GUI served"
          } finally {
            Stop-Process -Id $p.Id -Force
          }

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IVAO_VMR_Generator
          path: dist/IVAO_VMR_Generator.exe

      - name: Attach exe to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IVAO_VMR_Generator.exe
